name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: blacksmith-6vcpu-macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v6
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Install lint tools
        run: |
          brew install mint actionlint
          mint bootstrap
      - name: Lint
        run: make lint

  linux:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    container: swift:6.3
    steps:
      - uses: actions/checkout@v6
      - name: Install Mint and xcbeautify
        run: |
          git clone --depth 1 --branch 0.18.0 https://github.com/yonaskolb/Mint.git "$RUNNER_TEMP/Mint"
          swift build --package-path "$RUNNER_TEMP/Mint" -c release
          mint_bin="$(swift build --package-path "$RUNNER_TEMP/Mint" -c release --show-bin-path)"
          echo "$mint_bin" >> "$GITHUB_PATH"
          "$mint_bin/mint" install cpisciotta/xcbeautify
      - name: Verify Swift 6.3
        run: swift --version | grep -F 'Swift version 6.3'
      - name: Release build
        run: swift build -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Release tests
        run: swift test -c release 2>&1 | mint run --no-install cpisciotta/xcbeautify -q

  apple:
    runs-on: blacksmith-6vcpu-macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macOS
          - platform: iOS
            simulator-name: iPhone 17 Pro
            runtime-platform: iOS
    steps:
      - uses: actions/checkout@v6
      - name: Install xcbeautify
        run: |
          brew install mint
          mint install cpisciotta/xcbeautify
      - name: Verify Xcode 26.6 and Swift 6.3
        run: |
          xcodebuild -version | grep -F 'Xcode 26.6' 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
          swift --version | grep -F 'Swift version 6.3'
      - name: Ensure ${{ matrix.simulator-name }} simulator exists
        id: simulator
        if: matrix.platform != 'macOS'
        env:
          SIMULATOR_NAME: ${{ matrix.simulator-name }}
          RUNTIME_PLATFORM: ${{ matrix.runtime-platform }}
        run: |
          device_type_identifier="$(
            xcrun simctl list devicetypes --json |
              jq -er --arg name "$SIMULATOR_NAME" \
                'first(.devicetypes[] | select(.name == $name) | .identifier)'
          )"
          runtime_identifier="$(
            xcrun simctl list runtimes available --json |
              jq -er --arg platform "$RUNTIME_PLATFORM" '
                [
                  .runtimes[]
                  | select(.name | startswith($platform + " "))
                ]
                | sort_by(.version | split(".") | map(tonumber))
                | last
                | .identifier
              '
          )"

          if device_identifier="$(
            xcrun simctl list devices available --json |
              jq -er \
                --arg name "$SIMULATOR_NAME" \
                --arg runtime "$runtime_identifier" \
                'first(.devices[$runtime][] | select(.name == $name) | .udid)'
          )"; then
            echo "Using existing $SIMULATOR_NAME ($device_identifier)"
          else
            device_identifier="$(xcrun simctl create \
              "$SIMULATOR_NAME" \
              "$device_type_identifier" \
              "$runtime_identifier")"
          fi

          echo "device-id=$device_identifier" >> "$GITHUB_OUTPUT"
      - name: Build for ${{ matrix.platform }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            destination='platform=macOS'
          else
            destination="id=$SIMULATOR_ID"
          fi

          xcodebuild build -scheme SwiftStash -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
      - name: Test on ${{ matrix.platform }}
        env:
          SIMULATOR_ID: ${{ steps.simulator.outputs.device-id }}
        run: |
          if [ '${{ matrix.platform }}' = 'macOS' ]; then
            destination='platform=macOS'
          else
            destination="id=$SIMULATOR_ID"
          fi

          xcodebuild test -scheme SwiftStash -destination "$destination" 2>&1 | mint run --no-install cpisciotta/xcbeautify -q
